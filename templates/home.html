<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气查询系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">天气查询系统</h1>
            <p class="text-gray-600">查询历史天气数据</p>
        </div>

        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <form id="weather-form" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="city" class="block text-sm font-medium text-gray-700 mb-2">城市名称</label>
                        <input type="text" id="city" name="city" required 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                               placeholder="请输入城市名称（如：北京）">
                    </div>
                    <div>
                        <label for="date" class="block text-sm font-medium text-gray-700 mb-2">查询日期</label>
                        <input type="date" id="date" name="date" required 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>
                <button type="submit" 
                        class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200">
                    查询天气
                </button>
            </form>
        </div>

        <div id="loader" class="hidden text-center py-8">
            <div class="spinner mx-auto mb-4"></div>
            <p class="text-gray-600">正在查询天气数据...</p>
        </div>

        <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
        </div>

        <div id="result-container" class="hidden">
        </div>

        <div class="text-center text-xs text-gray-400 mt-8">
            <p>天气数据来源于天气后报网站</p>
            <p class="mt-1">使用 Flask 后端处理数据请求</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('weather-form');
        const cityInput = document.getElementById('city');
        const dateInput = document.getElementById('date');
        const loader = document.getElementById('loader');
        const errorMessage = document.getElementById('error-message');
        const resultContainer = document.getElementById('result-container');

        function initializeDate() {
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(today.getDate() - 1);
            const formattedDate = yesterday.toISOString().split('T')[0];
            dateInput.value = formattedDate;
            dateInput.max = formattedDate;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            resultContainer.classList.add('hidden');
            errorMessage.classList.add('hidden');
            loader.classList.remove('hidden');

            const city = cityInput.value.trim();
            const date = dateInput.value;

            const formData = new FormData();
            formData.append('city', city);
            formData.append('date', date);

            try {
                const response = await fetch('/weather', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error);
                }

                updateResultUI(data);

            } catch (error) {
                showError(error.message);
            } finally {
                loader.classList.add('hidden');
            }
        });

        function updateResultUI(data) {
            // Handle both database return format (data.data) and new scraping format (data.weather_data)
            const weather = data.weather_data || data.data;
            
            resultContainer.innerHTML = `
                <div class="bg-white rounded-lg shadow-md p-6">
                    <div class="text-center mb-6">
                        <h2 class="text-3xl font-bold text-gray-800 mb-2">${data.city || weather.city}</h2>
                        <p class="text-lg text-gray-600">${weather.date}</p>
                        ${data.message ? `<p class="text-sm text-green-600 mt-1">${data.message}</p>` : ''}
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- 白天天气 -->
                        <div class="bg-gradient-to-br from-yellow-50 to-orange-50 p-6 rounded-lg">
                            <h3 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                                <svg class="w-6 h-6 mr-2 text-yellow-500" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path>
                                </svg>
                                白天天气
                            </h3>
                            <div class="space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="text-gray-700">温度:</span>
                                    <span class="text-2xl font-bold text-orange-600">${weather.morning_temperature || weather.morning_temp || '暂无数据'}</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-gray-700">天气:</span>
                                    <span class="text-lg font-semibold text-gray-800">${weather.morning_weather || '暂无数据'}</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-gray-700">风向风力:</span>
                                    <span class="text-sm text-gray-600">${weather.morning_wind || '暂无数据'}</span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 夜间天气 -->
                        <div class="bg-gradient-to-br from-blue-50 to-indigo-50 p-6 rounded-lg">
                            <h3 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                                <svg class="w-6 h-6 mr-2 text-blue-500" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                                </svg>
                                夜间天气
                            </h3>
                            <div class="space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="text-gray-700">温度:</span>
                                    <span class="text-2xl font-bold text-blue-600">${weather.night_temperature || weather.night_temp || '暂无数据'}</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-gray-700">天气:</span>
                                    <span class="text-lg font-semibold text-gray-800">${weather.night_weather || '暂无数据'}</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-gray-700">风向风力:</span>
                                    <span class="text-sm text-gray-600">${weather.night_wind || '暂无数据'}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    </div>
                    
                    <!-- 详细信息 -->
                    <div class="mt-6 bg-gray-50 p-4 rounded-lg">
                        <h4 class="text-sm font-semibold text-gray-600 mb-2">详细信息:</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm text-gray-700">
                            <div><strong>白天:</strong> ${weather.morning_weather || '暂无数据'} ${weather.morning_temperature || weather.morning_temp || ''}</div>
                            <div><strong>夜间:</strong> ${weather.night_weather || '暂无数据'} ${weather.night_temperature || weather.night_temp || ''}</div>
                            ${weather.morning_wind_speed ? `<div><strong>白天风速:</strong> ${weather.morning_wind_speed}级</div>` : ''}
                            ${weather.night_wind_speed ? `<div><strong>夜间风速:</strong> ${weather.night_wind_speed}级</div>` : ''}
                        </div>
                    </div>
                </div>
            `;
            
            resultContainer.classList.remove('hidden');
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
        }

        initializeDate();
    </script>
</body>
</html>
